services:
  - type: web
    name: omnisave-backend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      npm install
      apt-get update
      apt-get install -y python3 python3-pip ffmpeg
      pip3 install yt-dlp
    startCommand: node backend-server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
