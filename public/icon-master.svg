<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c5cff" />
            <stop offset="50%" stop-color="#c026d3" />
            <stop offset="100%" stop-color="#ff2d55" />
        </linearGradient>
        <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#ffe0ec" />
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Full-bleed gradient background (maskable-safe: content stays centered) -->
    <rect width="512" height="512" fill="url(#bg)" />
    <!-- subtle radial highlight -->
    <circle cx="170" cy="150" r="220" fill="#ffffff" opacity="0.10" />

    <!-- Centered glyph group inside the maskable safe zone (~center 60%) -->
    <g filter="url(#soft)">
        <!-- Stylized O ring -->
        <circle cx="256" cy="248" r="120" fill="none" stroke="url(#ring)" stroke-width="26"
            stroke-linecap="round" stroke-dasharray="540 150" transform="rotate(-90 256 248)" />
        <!-- Download arrow -->
        <path d="M256 176v118m-46-46l46 46 46-46" fill="none" stroke="#ffffff" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" />
        <!-- Base line -->
        <path d="M196 320h120" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    </g>
</svg>
