<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c5cff" />
            <stop offset="50%" stop-color="#e1306c" />
            <stop offset="100%" stop-color="#ff0033" />
        </linearGradient>
    </defs>
    <!-- Dark background circle for nice contrast on any browser tab theme -->
    <rect width="32" height="32" rx="8" fill="#0a0a0f" />
    <!-- Outer stylized O ring with gradient -->
    <circle cx="16" cy="16" r="11" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="50 15" />
    <!-- Center down arrow -->
    <path d="M16 8v10m-3.5-3.5l3.5 3.5 3.5-3.5" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M11 21h10" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
